name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt "pyinstaller>=6.10"

      - name: 打包
        run: python -m PyInstaller --noconfirm --clean serial_tool.spec

      - name: 打压缩包（Linux）
        if: runner.os == 'Linux'
        run: |
          V=${GITHUB_REF_NAME#v}
          tar -czf "dist/LeecoSerial-v${V}-linux-x64.tar.gz" -C dist LeecoSerial

      - name: 打压缩包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $V = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path dist/LeecoSerial.exe -DestinationPath "dist/LeecoSerial-v$V-win64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/LeecoSerial*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/LeecoSerial*
          generate_release_notes: true
