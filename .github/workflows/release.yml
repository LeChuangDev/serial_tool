name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt 在 Linux runner 上需要这些系统库才能 import（offscreen 测试同样需要）
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 校验版本号（唯一源 serialtool/config.py）
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          cfg = pathlib.Path("serialtool/config.py").read_text(encoding="utf-8")
          project = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          app = re.search(r'^APP_VERSION\s*=\s*"([^"]+)"', cfg, re.M).group(1)
          pkg = re.search(r'^version\s*=\s*"([^"]+)"', project, re.M).group(1)
          print(f"config.APP_VERSION={app}  pyproject.version={pkg}")
          if not (pkg == app or pkg.startswith(app + ".")):
              sys.exit("版本号不一致：请同步 pyproject.toml 的 version")
          PY

      - name: 静态检查
        run: python -m ruff check .

      - name: 单元测试
        run: python -m pytest -q

      - name: 打包
        run: python -m PyInstaller --noconfirm --clean serial_tool.spec

      - name: 打包版本号
        shell: bash
        run: echo "APP_VERSION=$(python -c 'import serialtool.config as c; print(c.APP_VERSION)')" >> "$GITHUB_ENV"

      - name: 压缩（Linux）
        if: runner.os == 'Linux'
        run: |
          tar -czf "dist/LeecoSerial-v${APP_VERSION}-linux-x64.tar.gz" -C dist LeecoSerial
          ( cd dist && sha256sum "LeecoSerial-v${APP_VERSION}-linux-x64.tar.gz" > SHA256SUMS-linux.txt )

      - name: 压缩（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          PKG="LeecoSerial-v${APP_VERSION}-win64.zip"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/LeecoSerial' -DestinationPath 'dist/$PKG' -Force"
          ( cd dist && sha256sum "$PKG" > SHA256SUMS-windows.txt )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          # 只上传压缩包与校验和：裸二进制体积更大且无版本信息，不进 Release
          path: |
            dist/LeecoSerial-v*.zip
            dist/LeecoSerial-v*.tar.gz
            dist/SHA256SUMS-*.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      # 两个平台各生成一份校验和，合并成一份再上传
      - name: 合并校验和
        run: |
          cat pkg/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            pkg/LeecoSerial-v*-win64.zip
            pkg/LeecoSerial-v*-linux-x64.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
