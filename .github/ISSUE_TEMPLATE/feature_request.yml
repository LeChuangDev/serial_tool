name: 功能建议 / Feature request
description: 希望增加的能力或改进的交互
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [README 的 Roadmap](../../#-roadmap)，已规划的项目会优先处理。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么调试任务时卡住了？越具体越好
      placeholder: "例如：给 STM32 烧完固件后要连续发 20 条 AT 指令并逐条等 OK，现在只能一条条手点"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的做法
      description: 界面放在哪、怎么操作、输出是什么样
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 目前怎么绕过
      description: 现在用别的工具 / 脚本 / 手动操作怎么解决？这能帮助判断优先级
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只影响我的特定场景
        - 做同类调试的多数人会需要
        - 和主流工具（Serial Studio / VOFA+）的差距
